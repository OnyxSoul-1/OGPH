<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OGPH - BY OnyxSoul</title>
    <style>
        :root {
            --bg-dark: #121212;
            --bg-panel: #1e1e1e;
            --accent: #00ff9d; /* Onyx Neon Green */
            --text: #e0e0e0;
        }

        body {
            background: var(--bg-dark);
            color: var(--text);
            font-family: 'Consolas', monospace;
            margin: 0;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Left Side: Code Editor */
        .editor-pane {
            width: 40%;
            display: flex;
            flex-direction: column;
            border-right: 2px solid var(--accent);
            background: var(--bg-panel);
            transition: transform 0.3s ease;
            z-index: 50;
        }

        .pane-header {
            padding: 10px;
            background: #252526;
            font-weight: bold;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        textarea {
            flex: 1;
            background: #1e1e1e;
            color: #d4d4d4;
            border: none;
            padding: 15px;
            font-family: 'Consolas', monospace;
            font-size: 14px;
            resize: none;
            outline: none;
            line-height: 1.5;
        }

        .btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 5px 15px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 3px;
            white-space: nowrap;
            font-size: 13px;
        }
        
        .btn:hover { opacity: 0.8; }

        /* Right Side: Game Stage */
        .stage-pane {
            flex: 1;
            background: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* The Resizable Game Window */
        #gameWindow {
            width: 800px;
            height: 600px;
            background: white;
            position: relative;
            box-shadow: 0 0 50px rgba(0, 255, 157, 0.1);
            min-width: 320px;
            min-height: 240px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* The Mouse Drag Handle */
        .resize-handle {
            width: 20px;
            height: 20px;
            background: var(--accent);
            position: absolute;
            bottom: 0;
            right: 0;
            cursor: nwse-resize;
            border-top-left-radius: 100%;
            z-index: 10;
        }

        .resize-handle::after {
            content: '';
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 8px;
            height: 8px;
            border-right: 2px solid #000;
            border-bottom: 2px solid #000;
        }

        .fps-display {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: var(--accent);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
            z-index: 20;
        }

        /* HIDDEN FILE INPUT */
        #fileInput { display: none; }

        /* ZEN MODE / HIDE MENU STYLES */
        body.zen-mode .editor-pane {
            display: none !important;
        }
        
        body.zen-mode .stage-pane {
            width: 100%;
        }

        /* CLICKABLE NAME LINK */
        .name-link {
            position: fixed;
            bottom: 15px;
            right: 20px;
            color: var(--accent);
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            z-index: 100;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .name-link:hover {
            background: var(--accent);
            color: #000;
        }

        /* SHOW MENU BUTTON (Only visible in Zen Mode) */
        #showMenuBtn {
            display: none;
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 101;
            background: rgba(0,0,0,0.8);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }
        body.zen-mode #showMenuBtn { display: block; }
    </style>
</head>
<body>

    <!-- LEFT PANEL: CODE EDITOR -->
    <div class="editor-pane">
        <div class="pane-header">
            <span>📝 Game Source Code</span>
            <div style="display:flex; gap:5px;">
                <!-- FEATURE 2: ADD FILE BUTTON -->
                <button class="btn" onclick="document.getElementById('fileInput').click()">📂 Add File</button>
                <input type="file" id="fileInput" accept=".html,.htm" onchange="loadGameFile(event)">
                
                <!-- FEATURE 1: HIDE MENU BUTTON -->
                <button class="btn" onclick="toggleZenMode()">👁️ Hide UI</button>
                
                <button class="btn" onclick="updateGame()">▶ RUN</button>
            </div>
        </div>
        <textarea id="codeInput" placeholder="Paste your game's HTML code here..."></textarea>
    </div>

    <!-- RIGHT PANEL: GAME PREVIEW -->
    <div class="stage-pane" id="stage">
        <div id="gameWindow">
            <div class="fps-display" id="fpsDisplay">FPS: Waiting...</div>
            <!-- Sandbox updated for maximum compatibility with external assets -->
            <iframe id="gameFrame" sandbox="allow-scripts allow-same-origin allow-modals allow-forms allow-pointer-lock allow-popups allow-downloads"></iframe>
            <div class="resize-handle" id="dragHandle"></div>
        </div>
    </div>

    <!-- FEATURE 3: CLICKABLE NAME LINK -->
    <a href="https://github.com/OnyxSoul-1" target="_blank" class="name-link">OnyxSoul Dev ↗</a>

    <!-- SHOW MENU BUTTON (For when UI is hidden) -->
    <button id="showMenuBtn" onclick="toggleZenMode()">Show UI</button>

    <script>
        const gameWindow = document.getElementById('gameWindow');
        const dragHandle = document.getElementById('dragHandle');
        const fpsDisplay = document.getElementById('fpsDisplay');
        const frame = document.getElementById('gameFrame');

        // FEATURE 2: LOAD LOCAL HTML FILE (FIXED ENGINE)
        function loadGameFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const code = e.target.result;
                document.getElementById('codeInput').value = code;
                
                // INSTEAD OF SRCDOC, WE USE BLOB URL FOR BETTER ASSET LOADING
                const blob = new Blob([code], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                frame.src = url;
                
                // Clean up old URL to save memory
                frame.onload = () => URL.revokeObjectURL(url);
            };
            reader.readAsText(file);
            event.target.value = ''; // Reset input
        }

        // FEATURE 1: TOGGLE ZEN MODE (HIDE/SHOW UI)
        function toggleZenMode() {
            document.body.classList.toggle('zen-mode');
        }

        // RUN GAME FUNCTION (Fallback for pasted code)
        function updateGame() {
            const code = document.getElementById('codeInput').value;
            
            // Inject FPS Tracker
            const tracker = `
                <script>
                    let lastTime = performance.now();
                    let frames = 0;
                    function loop() {
                        frames++;
                        let now = performance.now();
                        if (now - lastTime >= 1000) {
                            window.parent.postMessage({type: 'fps', val: frames}, '*');
                            frames = 0;
                            lastTime = now;
                        }
                        requestAnimationFrame(loop);
                    }
                    loop();
                <\/script>
            `;
            
            // For pasted code, we still use srcdoc
            frame.srcdoc = code + tracker;
        }

        // MOUSE DRAG RESIZE LOGIC
        let isResizing = false;
        dragHandle.addEventListener('mousedown', (e) => {
            isResizing = true;
            e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            const rect = gameWindow.getBoundingClientRect();
            const newWidth = e.clientX - rect.left;
            const newHeight = e.clientY - rect.top;
            if (newWidth > 320) gameWindow.style.width = newWidth + 'px';
            if (newHeight > 240) gameWindow.style.height = newHeight + 'px';
        });

        document.addEventListener('mouseup', () => isResizing = false);

        // RECEIVE FPS DATA
        window.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'fps') {
                fpsDisplay.innerText = `FPS: ${e.data.val}`;
                fpsDisplay.style.color = e.data.val > 90 ? '#00ff9d' : '#ffaa00';
            }
        });

        // INITIAL SAMPLE CODE
        document.getElementById('codeInput').value = `<!DOCTYPE html>
<html>
<body style="background:#222; color:white; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;">
    <h1>Paste your game html code here!</h1>
</body>
</html>`;
        updateGame();
    </script>
</body>
</html>
